name: Custom Docker Image

on:
  push:
    branches:
      - jethac/media-library-improvements
  workflow_dispatch:
    inputs:
      tag:
        description: Additional image tag to publish
        required: false
        default: custom

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stash"
          short_sha="${GITHUB_SHA::12}"
          tag="${{ github.event.inputs.tag || 'custom' }}"
          tag="${tag//\//-}"
          tag="${tag//[^A-Za-z0-9_.-]/-}"

          {
            echo "image=${image}"
            echo "short_sha=${short_sha}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/build/x86_64/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GITHASH=${{ github.sha }}
            STASH_VERSION=custom-${{ steps.image.outputs.short_sha }}
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.image }}:media-library-improvements
            ${{ steps.image.outputs.image }}:sha-${{ steps.image.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=custom-${{ steps.image.outputs.short_sha }}
